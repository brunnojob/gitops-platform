apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-notifications-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
data:
  service.webhook.platform-alerts: |
    url: https://alerts.platform.example.org/argocd
    headers:
      - name: Content-Type
        value: application/json
  template.sync-failed: |
    webhook:
      platform-alerts:
        method: POST
        body: |
          {"application":"{{.app.metadata.name}}","event":"sync-failed","phase":"{{.app.status.operationState.phase}}"}
  template.health-degraded: |
    webhook:
      platform-alerts:
        method: POST
        body: |
          {"application":"{{.app.metadata.name}}","event":"health-degraded","health":"{{.app.status.health.status}}"}
  trigger.on-sync-failed: |
    - when: app.status.operationState != nil and app.status.operationState.phase in ['Error', 'Failed']
      send: [sync-failed]
  trigger.on-health-degraded: |
    - when: app.status.health.status == 'Degraded'
      send: [health-degraded]
  subscriptions: |
    - recipients: [platform-alerts]
      triggers: [on-sync-failed, on-health-degraded]
