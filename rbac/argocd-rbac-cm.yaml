apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
data:
  policy.default: role:readonly
  policy.matchMode: glob
  scopes: '[groups]'
  policy.csv: |
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, projects, get, *, allow
    p, role:readonly, logs, get, */*, allow
    p, role:deployer, applications, get, workloads-prod/*, allow
    p, role:deployer, applications, sync, workloads-prod/*-dev, allow
    p, role:deployer, applications, sync, workloads-prod/*-staging, allow
    p, role:deployer, applications, action/*, workloads-prod/*-dev, allow
    p, role:deployer, applications, action/*, workloads-prod/*-staging, allow
    p, role:admin, *, *, *, allow
    g, platform-admins, role:admin
    g, platform-deployers, role:deployer
    g, platform-readers, role:readonly
