apiVersion: v1
kind: Service
metadata:
  name: sample-api-stable
spec:
  ports: [{name: http, port: 80, targetPort: http}]
  selector: {app: sample-api}
---
apiVersion: v1
kind: Service
metadata:
  name: sample-api-canary
spec:
  ports: [{name: http, port: 80, targetPort: http}]
  selector: {app: sample-api}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.platform.example.org]
      secretName: sample-api-tls
  rules:
    - host: api.platform.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sample-api-stable
                port: {number: 80}
