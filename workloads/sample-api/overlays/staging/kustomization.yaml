apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sample-api-staging
resources: [../../base]
patches:
  - target: {kind: Rollout, name: sample-api}
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
  - target: {kind: Ingress, name: sample-api}
    patch: |-
      - op: replace
        path: /spec/tls/0/hosts/0
        value: staging.api.platform.example.org
      - op: replace
        path: /spec/rules/0/host
        value: staging.api.platform.example.org
