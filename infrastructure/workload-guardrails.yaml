apiVersion: v1
kind: Namespace
metadata:
  name: sample-api-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: sample-api-staging
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: sample-api-prod
  annotations:
    argocd.argoproj.io/sync-wave: "-7"
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sample-api-isolation
  namespace: sample-api-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-6"
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - {protocol: TCP, port: 8080}
  egress: []
---
