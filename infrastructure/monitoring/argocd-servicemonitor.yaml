apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-components
  namespace: argocd
  labels:
    release: kube-prometheus-stack
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [application-controller, server, repo-server]
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
