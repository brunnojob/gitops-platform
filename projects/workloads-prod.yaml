apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: workloads-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  description: Workloads isolados por namespace
  sourceRepos:
    - https://github.com/brunnojob/gitops-platform.git
  destinations:
    - {server: 'https://kubernetes.default.svc', namespace: sample-api-dev}
    - {server: 'https://kubernetes.default.svc', namespace: sample-api-staging}
    - {server: 'https://kubernetes.default.svc', namespace: sample-api-prod}
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - {group: argoproj.io, kind: Rollout}
    - {group: argoproj.io, kind: AnalysisTemplate}
    - {group: '', kind: Service}
    - {group: networking.k8s.io, kind: Ingress}
  namespaceResourceBlacklist:
    - {group: '', kind: Secret}
    - {group: '', kind: ServiceAccount}
    - {group: rbac.authorization.k8s.io, kind: Role}
    - {group: rbac.authorization.k8s.io, kind: RoleBinding}
    - {group: networking.k8s.io, kind: NetworkPolicy}
  orphanedResources:
    warn: true
