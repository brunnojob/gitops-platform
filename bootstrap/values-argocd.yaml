global:
  domain: localhost
  logging:
    format: json
    level: info
crds:
  install: true
  keep: true
configs:
  cm:
    create: true
    url: https://localhost:8080
    admin.enabled: "true"
    exec.enabled: "false"
    application.resourceTrackingMethod: annotation
  params:
    create: true
    server.insecure: "false"
  rbac:
    create: false
controller:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
  metrics:
    enabled: true
    service:
      enabled: true
server:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {memory: 512Mi}
  metrics:
    enabled: true
    service:
      enabled: true
  ingress:
    enabled: false
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {memory: 512Mi}
  metrics:
    enabled: true
    service:
      enabled: true
applicationSet:
  replicas: 1
notifications:
  enabled: false
redis:
  enabled: true
redis-ha:
  enabled: false
  haproxy:
    enabled: false
